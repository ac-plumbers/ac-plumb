settings:
  content:
    merge: true

content:
  - name: services
    label: Services
    type: collection
    path: src/content/services
    extension: md

    view:
      primary: title
      fields: [title, sortedOrder, category, featured, tags]
      sort: [title]

    fields:
      - { name: title, label: Title, type: string }
      - { name: slug, label: URL Slug, type: string }
      - { name: description, label: Description, type: text }
      - { name: paragraph, label: Paragraph, type: text }
      - { name: sortedOrder, label: Sort Order, type: number }

      - name: tags
        label: Tags
        type: string
        list: true

      - { name: featured, label: Featured, type: boolean }
      - { name: category, label: Category, type: string }

      # New fields for richer content
      - { name: intro, label: Intro, type: text }
      - name: benefits
        label: Benefits
        type: string
        list: true
      - name: specialties
        label: Specialties
        type: string
        list: true

      # Features (list of objects)
      - name: features
        label: Features
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - { name: title, label: Feature Title, type: string }
          - { name: description, label: Feature Description, type: text }

      # FAQs (list of objects)
      - name: faqs
        label: FAQs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.question}"
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

      - name: body
        label: Content
        type: rich-text

  - name: areas
    label: Areas
    type: collection
    path: src/content/areas
    extension: md

    view:
      primary: area
      fields: [area, title, sortOrder, level, featured]
      sort: [sortOrder]

    fields:
      - { name: area, label: Area Name, type: string }
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }

      - { name: sortOrder, label: Sort Order, type: number }
      - { name: featured, label: Featured, type: boolean }

      - name: services
        label: Services (slugs)
        type: string
        list: true

      - { name: postcode, label: Postcode, type: string }
      - { name: level, label: Coverage Level, type: string }
      - { name: responseTime, label: Response Time, type: string }
      - { name: region, label: Region, type: string }

      - name: neighborhoods
        label: Neighborhoods
        type: string
        list: true

      - name: faqs
        label: FAQs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.question}"
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

      - { name: specificContent, label: Specific Content, type: text }

      - name: body
        label: Content
        type: rich-text

  - name: legal
    label: Legal Pages
    type: collection
    path: src/content/legal
    extension: md

    view:
      primary: page
      fields: [page, title, pubDate]
      sort: [page]

    fields:
      - { name: page, label: Page Name, type: string }
      - { name: pubDate, label: Published Date, type: date }
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: keywords, label: Keywords, type: text }
      - { name: author, label: Author, type: string }
      - { name: datePublished, label: Date Published (ISO), type: string }
      - { name: dateModified, label: Date Modified (ISO), type: string }
      - name: body
        label: Content
        type: rich-text
